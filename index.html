<style>
/* Layout: btumobility.ge style. White header, magenta-to-indigo hero, light grey canvas, white rounded cards with a gradient top edge. */
:root {
  color-scheme: light;
  --bg: #F9FAFB;
  --surface: #FFFFFF;
  --ink: #111827;
  --ink-2: #374151;
  --muted: #6B7280;
  --line: #E5E7EB;
  --pink: #E5007D;
  --pink-deep: #CC006F;
  --pink-soft: #FDE7F3;
  --indigo: #2E1FB8;
  --ok: #15803D; --ok-bg: #F0FDF4; --ok-line: #BBF7D0;
  --bad: #B91C1C; --bad-bg: #FEF2F2; --bad-line: #FECACA;
  --warn: #92400E; --warn-bg: #FFFBEB; --warn-line: #FDE68A;
  --violet: #7E22CE; --violet-bg: #FAF5FF;
  --s-skill: #FF3F3F; --s-applied: #5E00FF; --s-adv: #07207E;
  --grad: linear-gradient(90deg, #E5007D, #2E1FB8);
  --f-body: "Figtree", "Noto Sans Georgian", ui-sans-serif, system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 1px 2px rgba(17, 24, 39, .05), 0 1px 3px rgba(17, 24, 39, .06);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--pink-deep); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 12.5px; word-break: break-all; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* header */
header.site { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 11; }
.head-in { display: flex; align-items: center; gap: 20px; min-height: 68px; flex-wrap: wrap; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo-mark { background: var(--pink); color: #fff; font-weight: 800; font-size: 17px; letter-spacing: .02em; padding: 4px 8px; line-height: 1; border-radius: 4px; }
.logo-text { font-weight: 700; font-size: 14px; line-height: 1.15; }
.logo-text span { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
nav.main { display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none; }
nav.main a { text-decoration: none; color: var(--ink-2); font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
nav.main a:hover { background: var(--pink-soft); color: var(--pink-deep); }
nav.main a[aria-current="page"] { background: var(--pink-soft); color: var(--pink-deep); }
.proto { font-size: 12px; font-weight: 600; color: var(--pink-deep); background: var(--pink-soft); border-radius: 99px; padding: 4px 10px; white-space: nowrap; }
.session { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.who { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.25; }
.who b { display: block; color: var(--ink); font-weight: 600; }
@media (max-width: 760px) { nav.main { order: 3; flex-basis: 100%; } .session { margin-left: auto; } .who { display: none; } }

/* hero */
.hero { background: linear-gradient(135deg, #E5007D 0%, #D2007B 42%, #3A1CB6 100%); color: #fff; position: relative; overflow: hidden; }
.hero .wrap { position: relative; z-index: 1; padding-block: 56px 112px; }
.hero svg.chev { position: absolute; right: -40px; top: -20px; height: 140%; opacity: .14; z-index: 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, .16); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
.hero h1 { font-size: clamp(28px, 4.6vw, 46px); font-weight: 800; letter-spacing: -.01em; margin-top: 16px; max-width: 20ch; line-height: 1.12; }
.hero p { font-size: 17px; max-width: 60ch; color: rgba(255, 255, 255, .9); margin: 14px 0 0; }
.page-head { padding-block: 34px 6px; }
.page-head h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 800; }
.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }

/* cards */
main { padding-bottom: 64px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 22px; min-width: 0; position: relative; }
.card.edge { overflow: hidden; }
.card.edge::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--grad); }
.card h2 { font-size: 19px; font-weight: 700; }
.card h3 { font-size: 16px; font-weight: 700; }
.lift { margin-top: -72px; position: relative; z-index: 2; }
.stack { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
.stack > *, .grid2 > *, .grid3 > *, .grid4 > * { min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 880px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

/* forms */
label.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
input, select, textarea { font: 15px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid #D1D5DB; border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pink); outline-offset: 0; border-color: var(--pink); }
input.code { font-family: var(--f-mono); letter-spacing: .06em; text-transform: uppercase; font-size: 16px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px var(--f-body); padding: 10px 16px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: #D1D5DB; background: #F9FAFB; }
.btn.primary { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; box-shadow: 0 1px 2px rgba(204, 0, 111, .3); }
.btn.primary:hover { background: #B30062; }
.btn.light { background: #fff; color: var(--pink-deep); border-color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--pink-deep); padding-inline: 8px; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, nav.main a:focus-visible, .chip:focus-visible, .tab:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
.form { display: grid; gap: 14px; }
.inline-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; }
@media (max-width: 560px) { .inline-form { grid-template-columns: minmax(0, 1fr); } }
.hint { font-size: 13px; color: var(--muted); }
.drop { border: 1.5px dashed #D1D5DB; border-radius: 12px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: #FCFCFD; }
.drop input[type=file] { border: 0; padding: 0; width: auto; flex: 1; min-width: 200px; background: transparent; }
.or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

/* pills, chips */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.violet { background: var(--violet-bg); color: var(--violet); }
.pill.grey { background: #F3F4F6; color: var(--ink-2); }
.pill.pink { background: var(--pink-soft); color: var(--pink-deep); }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.cat i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--pink-deep); border-color: var(--pink-deep); color: #fff; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 18px; }
.tab { all: unset; cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--pink-deep); border-bottom-color: var(--pink-deep); }

/* verification result */
.checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 700px) { .checks { grid-template-columns: minmax(0, 1fr); } }
.check { border-radius: 14px; padding: 18px; border: 1px solid; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; }
.check .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #fff; }
.check.ok { background: var(--ok-bg); border-color: var(--ok-line); } .check.ok .ic { background: var(--ok); }
.check.bad { background: var(--bad-bg); border-color: var(--bad-line); } .check.bad .ic { background: var(--bad); }
.check.warn { background: var(--warn-bg); border-color: var(--warn-line); } .check.warn .ic { background: #D97706; }
.check .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.check b { display: block; font-size: 17px; margin-top: 2px; }
.check p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn); }
.notice.info { border-color: #FBCFE8; background: #FDF2F8; color: #831843; }
.notice.bad { border-color: var(--bad-line); background: var(--bad-bg); color: var(--bad); }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; font-weight: 600; }
@media (max-width: 480px) { dl.kv { grid-template-columns: minmax(0, 1fr); gap: 2px; } dl.kv dd { margin-bottom: 8px; } }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); background: #F9FAFB; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
table.sheet { font-size: 12.5px; }
table.sheet th .col { display: block; font-family: var(--f-mono); color: #9CA3AF; font-weight: 600; }
table.sheet td { white-space: nowrap; }
table.sheet td.wrap { white-space: normal; min-width: 220px; }
table.sheet th.sys, table.sheet td.sys { background: #FDF2F8; }
.tbl.tall { max-height: 520px; }

/* stats */
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.stat b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.stat.hot b { color: var(--pink-deep); }

/* passport preview */
.pages { display: grid; gap: 16px; max-width: 980px; margin-inline: auto; width: 100%; }
.pages canvas { width: 100%; height: auto; border-radius: 10px; box-shadow: 0 6px 20px rgba(17, 24, 39, .12); background: #2c2c2c; display: block; }
.pages iframe { width: 100%; height: 70vh; border: 0; border-radius: 10px; }
.skel { aspect-ratio: 841 / 595; border-radius: 10px; background: linear-gradient(90deg, #EEF0F3, #F6F7F9, #EEF0F3); background-size: 200% 100%; animation: sh 1.4s infinite linear; max-width: 100%; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
details.sql summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--pink-deep); }
details.sql pre { background: #0F172A; color: #E2E8F0; border-radius: 10px; padding: 14px; overflow: auto; font-size: 12px; max-height: 320px; margin: 10px 0 0; white-space: pre-wrap; word-break: break-word; }

/* modal + toast */
.modal { position: fixed; inset: 0; background: rgba(17, 24, 39, .55); z-index: 30; display: grid; place-items: start center; overflow: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.modal .card { width: min(1000px, 100%); margin-top: 16px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
.loading { padding-block: 80px; text-align: center; color: var(--muted); }
footer.site { border-top: 1px solid var(--line); background: var(--surface); }
footer.site .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; font-size: 13px; color: var(--muted); }
</style>
