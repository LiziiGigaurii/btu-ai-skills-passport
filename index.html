<title>BTU AI Skills Passport</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="BTU AI Skills Digital Passport prototype: verifiable AI skill stamps, versioning and blockchain-style verification.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+Georgian:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: BTU magenta band on top, tabbed tool below; the passport itself is white "paper" following BTU's 4-page visual concept */
:root {
  --bg: #FBF6F9; --surface: #FFFFFF; --fg: #1C1220; --muted: #6F5F6B; --line: #EDD8E4;
  --accent: #D4208F; --accent-ink: #FFFFFF; --accent-deep: #9C0E66; --accent-soft: #FCE4F2;
  --ok: #1E7D46; --ok-bg: #DDF3E5; --warn: #8A5A00; --warn-bg: #FCEFCF; --bad: #B3261E; --bad-bg: #FADCD9;
  --paper: #FFFFFF; --ink: #111111; --paper-line: rgba(17,17,17,.18);
  --s-skill: #E8412C; --s-applied: #6B2BF5; --s-adv: #1B2A7A;
  --f-display: "Archivo Black", "Noto Sans Georgian", "Arial Black", sans-serif;
  --f-body: "Noto Sans Georgian", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1318; --surface: #261C23; --fg: #F3EAF0; --muted: #B9A6B3; --line: #3D2C37; --accent-soft: #3F1A31;
  --ok: #6FD49A; --ok-bg: #173323; --warn: #F2C361; --warn-bg: #3A2E12; --bad: #FF8A80; --bad-bg: #3D1B19;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1A1318; --surface: #261C23; --fg: #F3EAF0; --muted: #B9A6B3; --line: #3D2C37; --accent-soft: #3F1A31;
  --ok: #6FD49A; --ok-bg: #173323; --warn: #F2C361; --warn-bg: #3A2E12; --bad: #FF8A80; --bad-bg: #3D1B19;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.band { background: var(--accent); color: #fff; }
.band-in, .wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band-in { padding-block: 22px 24px; }
.wrap { padding-block: 0 56px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-mark { background: #fff; color: var(--accent); font-family: var(--f-display); font-size: 12px; line-height: 1.05; padding: 6px 9px; letter-spacing: .02em; }
.brand h1 { margin: 0; font-family: var(--f-display); font-size: 22px; letter-spacing: .01em; text-wrap: balance; }
.brand p { margin: 0; color: rgba(255,255,255,.86); font-size: 13px; }
.top-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.demo-note { font-size: 12px; color: rgba(255,255,255,.86); max-width: 44ch; margin: 0; }
.theme-btn { all: unset; cursor: pointer; border: 1.5px solid rgba(255,255,255,.7); color: #fff; padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.theme-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

nav.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
nav.tabs button { all: unset; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 14px; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button:hover { color: var(--accent); }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .linkish:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { margin-top: 22px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 14px var(--f-body); padding: 8px 14px; cursor: pointer; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
select, input, textarea { font: 14px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
textarea { font-family: var(--f-mono); font-size: 12px; min-height: 220px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 12px; word-break: break-all; }
h2.h { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
.lead { margin: 0 0 18px; color: var(--muted); max-width: 70ch; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
@media (max-width: 920px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.side { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--accent); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.side h3, .card h3 { margin: 0; font-size: 15px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 760px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.form { display: grid; gap: 12px; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

.ver { border-left: 3px solid var(--line); padding: 6px 8px 6px 10px; display: grid; gap: 2px; font-size: 13px; }
.ver.active { border-left-color: var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
.ver .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; letter-spacing: .03em; display: inline-block; }
.pill.ACTIVE, .pill.good { background: var(--ok-bg); color: var(--ok); }
.pill.SUPERSEDED, .pill.mid { background: var(--warn-bg); color: var(--warn); }
.pill.REVOKED, .pill.low { background: var(--bad-bg); color: var(--bad); }
.pill.tier { background: var(--accent-soft); color: var(--accent-deep); }
.add { color: var(--ok); } .rem { color: var(--bad); }
.linkish { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.result { border-radius: 10px; padding: 18px; display: grid; gap: 6px; }
.result .big { font-size: 20px; font-weight: 800; }
.result.VALID { background: var(--ok-bg); color: var(--ok); }
.result.OUTDATED { background: var(--warn-bg); color: var(--warn); }
.result.REVOKED, .result.NOT_FOUND { background: var(--bad-bg); color: var(--bad); }
.result dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; color: var(--fg); font-size: 13px; }
.result dt { font-weight: 600; } .result dd { margin: 0; min-width: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }

/* ---------- Passport paper ---------- */
.paper { background: var(--paper); color: var(--ink); border-radius: 14px; border-top: 6px solid var(--accent); padding: 32px 36px 72px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(156,14,102,.14); min-height: 420px; }
.paper + .paper { margin-top: 22px; }
.paper .foot-l { position: absolute; left: 36px; bottom: 22px; background: var(--accent); font-family: var(--f-display); font-size: 12px; line-height: 1.05; padding: 6px 9px; color: #fff; }
.paper .foot-r { position: absolute; right: 36px; bottom: 26px; font-family: var(--f-display); font-size: 11px; letter-spacing: .04em; }
.paper .page-no { position: absolute; right: 36px; top: 20px; font-size: 11px; color: rgba(17,17,17,.45); font-family: var(--f-mono); }
.shared-flag { display: inline-block; margin-bottom: 10px; background: var(--accent-soft); color: var(--accent-deep); font-size: 11px; font-weight: 800; letter-spacing: .05em; padding: 3px 9px; border-radius: 99px; }
.p-title { font-family: var(--f-display); font-size: clamp(30px, 6vw, 52px); line-height: .95; margin: 0; letter-spacing: -.01em; }
.p-sub { font-size: clamp(24px, 4.6vw, 40px); font-weight: 400; margin: 2px 0 0; letter-spacing: .01em; }
.stars { position: absolute; right: 36px; top: 34px; display: grid; gap: 4px; color: var(--accent); font-size: 22px; line-height: 1; }
.cover-fields { margin-top: 34px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; max-width: 560px; }
.cover-fields div { font-family: var(--f-display); font-size: 14px; letter-spacing: .03em; }
.cover-fields span { font-family: var(--f-body); font-weight: 600; font-size: 16px; letter-spacing: 0; display: block; border-bottom: 1px solid var(--paper-line); padding-bottom: 3px; }
.tier-bars { margin-top: 26px; display: grid; gap: 6px; max-width: 420px; }
.tbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 34px; gap: 8px; align-items: center; font-size: 11px; font-weight: 600; }
.tbar .track { height: 8px; background: rgba(17,17,17,.08); border-radius: 99px; overflow: hidden; }
.tbar .fill { height: 100%; border-radius: 99px; }
.tbar .n { font-family: var(--f-mono); text-align: right; }
.cover-stamps { position: absolute; right: 40px; bottom: 70px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.cs { font-family: var(--f-display); font-size: 10px; padding: 5px 9px; letter-spacing: .04em; }
.cs.a { background: var(--accent); color: #fff; transform: rotate(-6deg); }
.cs.b { background: #fff; color: var(--accent-deep); border: 2px solid var(--accent-deep); transform: rotate(5deg); }
.qrbox { display: grid; justify-items: center; gap: 4px; background: #fff; padding: 6px; border: 1px solid var(--paper-line); }
.qrbox small { font-size: 9px; letter-spacing: .05em; font-family: var(--f-display); }
@media (max-width: 680px) {
  .paper { padding: 22px 18px 70px; }
  .paper .foot-l { left: 18px; } .paper .foot-r { right: 18px; } .stars { right: 18px; } .paper .page-no { right: 18px; }
  .cover-fields { grid-template-columns: minmax(0, 1fr); }
  .cover-stamps { position: static; align-items: flex-start; margin-top: 22px; }
}
.about { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 28px; }
@media (max-width: 760px) { .about { grid-template-columns: minmax(0, 1fr); } }
.about h3 { font-family: var(--f-display); font-size: 22px; line-height: 1.05; margin: 0 0 10px; }
.about h4 { font-family: var(--f-display); font-size: 17px; margin: 0 0 12px; color: var(--accent); }
.about p { font-size: 13px; margin: 0 0 10px; }
.tier-row { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; align-items: center; margin-bottom: 12px; font-size: 12px; }
.tier-row b { display: block; font-family: var(--f-display); font-size: 12px; letter-spacing: .03em; }
.grow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--f-display); font-size: 11px; letter-spacing: .04em; margin-top: 8px; }
.grow span { border: 1.5px solid var(--ink); padding: 3px 7px; }
.grow i { font-style: normal; color: var(--accent); }
.sec-h { font-family: var(--f-display); font-size: 24px; margin: 0; }
.sec-s { font-size: 12px; margin: 2px 0 16px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); border-top: 1px solid var(--paper-line); border-left: 1px solid var(--paper-line); }
.scell { border-right: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); min-height: 168px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.scell .d { font-family: var(--f-mono); font-size: 10px; color: rgba(17,17,17,.55); }
.scell b { font-size: 11px; text-transform: uppercase; line-height: 1.2; letter-spacing: .02em; }
.scell .t { font-size: 10px; color: rgba(17,17,17,.6); }
.scell.new { animation: pop .8s ease-out; }
@keyframes pop { from { background: rgba(212,32,143,.22); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .scell.new { animation: none; } }
.stamp { display: grid; place-items: center; flex: none; }
.st-skill { width: 58px; height: 52px; position: relative; }
.st-skill::before { content: ""; position: absolute; inset: 0; background: var(--s-skill); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.st-skill span { position: relative; margin-top: 20px; color: #fff; font-family: var(--f-display); font-size: 7px; letter-spacing: .04em; }
.st-applied { border: 2px solid var(--s-applied); padding: 2px; transform: rotate(-4deg); }
.st-applied span { background: var(--s-applied); color: #fff; font-family: var(--f-display); font-size: 7px; line-height: 1.2; padding: 6px; text-align: center; display: block; letter-spacing: .03em; }
.st-adv { width: 54px; height: 54px; border-radius: 50%; background: var(--s-adv); box-shadow: 0 0 0 3px #fff inset, 0 0 0 2px var(--s-adv); color: #fff; font-family: var(--f-display); font-size: 7px; text-align: center; line-height: 1.2; letter-spacing: .03em; }
.tbl-wrap { overflow-x: auto; }
table.det { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 640px; }
table.det th { text-align: left; font-family: var(--f-display); font-size: 11px; letter-spacing: .04em; border-bottom: 2px solid var(--ink); padding: 8px 8px 8px 0; }
table.det td { border-bottom: 1px solid var(--paper-line); padding: 8px 8px 8px 0; vertical-align: middle; }
table.det td.sk { font-weight: 800; text-transform: uppercase; font-size: 11px; }
table.det td.dt { font-family: var(--f-mono); font-size: 11px; white-space: nowrap; }

/* ---------- lists, tables in app chrome ---------- */
table.list { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 620px; }
table.list th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0; }
table.list td { border-bottom: 1px solid var(--line); padding: 10px 10px 10px 0; vertical-align: middle; }
table.list td.num { font-variant-numeric: tabular-nums; }
.mini-stamps { display: flex; gap: 4px; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; display: inline-block; flex: none; }
.dot.AI_SKILL { background: var(--s-skill); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.dot.AI_APPLIED_SKILL { background: var(--s-applied); }
.dot.AI_ADVANCED_SKILL { background: var(--s-adv); border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.tile b { display: block; font-family: var(--f-display); font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile span { font-size: 13px; color: var(--muted); }
.hbars { display: grid; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.hbar .track { height: 12px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 3px; }
.hbar .n { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
@media (max-width: 560px) { .hbar { grid-template-columns: minmax(0, 1fr) 28px; } .hbar .track { grid-column: 1 / -1; grid-row: 2; } }
.cols { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding-top: 8px; border-bottom: 1px solid var(--line); }
.col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; min-width: 0; }
.col .bar { width: 100%; max-width: 46px; background: var(--accent); border-radius: 4px 4px 0 0; }
.col .v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.col-l { display: flex; gap: 10px; }
.col-l span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); min-width: 0; }
.log { display: grid; gap: 6px; font-size: 13px; max-height: 340px; overflow: auto; }
.log div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }

.match { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ring { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--accent-soft) 0); position: relative; }
.ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--surface); }
.ring span { position: relative; z-index: 1; }

.block { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; font-size: 13px; min-width: 0; }
.block.broken { border-color: var(--bad); background: var(--bad-bg); }
.chain { display: grid; gap: 8px; }
.chain .link { text-align: center; color: var(--muted); font-size: 12px; line-height: 1; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 2px 10px; }
.kv > span:nth-child(odd) { color: var(--muted); font-size: 12px; }
.confirm { background: var(--bad-bg); color: var(--fg); border-radius: 8px; padding: 10px; display: grid; gap: 8px; font-size: 13px; }
details.box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
details.box summary { cursor: pointer; font-weight: 600; font-size: 14px; }
details.box[open] summary { margin-bottom: 8px; }
.vis-list { display: grid; gap: 6px; font-size: 13px; }
.vis-list label { display: flex; gap: 8px; align-items: flex-start; }
.csv-out { display: grid; gap: 2px; font-size: 13px; }
.qitem { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; font-size: 14px; }
.warn-t { color: var(--warn); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; margin: 0 0 18px; }
.flow span { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.flow span.hot { background: var(--accent); border-color: var(--accent); color: #fff; }
.flow i { font-style: normal; color: var(--accent); }
.ring.lg { width: 104px; height: 104px; font-size: 22px; }
.ring.lg::after { inset: 10px; }
.role-head { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 480px) { .role-head { grid-template-columns: minmax(0, 1fr); } }
.role-head h2 { margin: 0; font-size: 22px; text-wrap: balance; }
.role-head p { margin: 4px 0 0; }
.nextbox { background: var(--accent-soft); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.nextbox .lbl { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--accent-deep); }
.nextbox b { font-size: 17px; }
:root[data-theme="dark"] .nextbox .lbl { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nextbox .lbl { color: var(--accent); } }
.road { display: grid; }

/* =========================================================
   2. Hashing
   ========================================================= */
function canonicalize(v) {
  if (Array.isArray(v)) return "[" + v.map(canonicalize).join(",") + "]";
  if (v !== null && typeof v === "object") {
    return "{" + Object.keys(v).sort().filter(k => v[k] !== undefined)
      .map(k => JSON.stringify(k) + ":" + canonicalize(v[k])).join(",") + "}";
  }
  return JSON.stringify(v);
}
async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
const hashPassport = data => sha256(canonicalize(data));

/* =========================================================
   4. Simulated blockchain
   ========================================================= */
async function blockHash(b) {
  return sha256(canonicalize({ index: b.index, timestamp: b.timestamp, action: b.action, passportHash: b.passportHash, prevHash: b.prevHash }));
}
async function addBlock(action, passportHash, when) {
  const prev = state.ledger[state.ledger.length - 1];
  const b = { index: state.ledger.length, timestamp: when || new Date().toISOString(), action, passportHash, prevHash: prev ? prev.hash : ZERO };
  b.hash = await blockHash(b);
  state.ledger.push(b);
  return b;
}
async function checkChain() {
  const bad = new Set();
  for (let i = 0; i < state.ledger.length; i++) {
    const b = state.ledger[i];
    const expectedPrev = i === 0 ? ZERO : state.ledger[i - 1].hash;
    if ((await blockHash(b)) !== b.hash || b.prevHash !== expectedPrev) bad.add(i);
  }
  return bad;
}

/* =========================================================
   5. Passport generation, versions, verification
   ========================================================= */
async function createVersion(st, changelog, when) {
  const last = st.versions[st.versions.length - 1];
  const issuedAt = when || new Date().toISOString();
  const data = {
    passportId: st.passportId,
    version: (last ? last.versionNo : 0) + 1,
    issuer: ISSUER,
    issuedAt,
    holder: { firstName: st.firstName, lastName: st.lastName },
    previousHash: last ? last.hash : null,
    stamps: [...st.stamps].sort((a, b) => a.earnedAt.localeCompare(b.earnedAt)).map(s => {
      const k = SKILL[s.code];
      return { code: k.code, skill: k.name, tier: k.tier, source: k.source, description: s.description || k.description, earnedThrough: s.earnedThrough, earnedAt: s.earnedAt, issuedVia: s.issuedVia || "ADMIN" };
    }),
  };
  const hash = await hashPassport(data);
  if (last && last.status === "ACTIVE") last.status = "SUPERSEDED";
  const block = await addBlock("ISSUE", hash, issuedAt);
  const v = { versionNo: data.version, data, hash, previousHash: data.previousHash, status: "ACTIVE", changelog, createdAt: issuedAt, block: block.index };
  st.versions.push(v);
  logAction(st.firstName + " " + st.lastName + " · v" + v.versionNo + " · " + changelog, issuedAt);
  return v;
}
function diff(a, b) {
  const inA = new Set(a.stamps.map(s => s.code)), inB = new Set(b.stamps.map(s => s.code));
  return { added: b.stamps.filter(s => !inA.has(s.code)), removed: a.stamps.filter(s => !inB.has(s.code)) };
}
async function verifyHash(h) {
  h = (h || "").trim().toLowerCase();
  const issue = state.ledger.find(b => b.action === "ISSUE" && b.passportHash === h);
  if (!issue) return { status: "NOT_FOUND", hash: h };
  const revoked = state.ledger.some(b => b.action === "REVOKE" && b.passportHash === h);
  let ver = null, st = null;
  for (const s of state.students) { const v = s.versions.find(x => x.hash === h); if (v) { ver = v; st = s; } }
  const status = revoked ? "REVOKED" : (ver && ver.status === "SUPERSEDED") ? "OUTDATED" : "VALID";
  return { status, hash: h, block: issue, version: ver, student: st };
}

  return TIER[tier].earned;
}

  const st = state.students.find(s => s.email === rec.email);
  if (!st) return { d: "REVIEW", why: "ამ ელფოსტით სტუდენტი პასპორტების სისტემაში ვერ მოიძებნა" };
  if (st.stamps.some(s => s.code === rec.code)) return { d: "SKIPPED", why: "ეს შტამპი სტუდენტს უკვე აქვს" };
  const k = KIND[SKILL[rec.code].tier];
  if (k === "course") {
    const g = Number(rec.result);
    if (rec.result === "" || !Number.isFinite(g) || g < 0 || g > 100) return { d: "REVIEW", why: "ნიშანი არასწორია (" + rec.result + "), საჭიროა შემოწმება" };
    if (g < state.rules.passGrade) return { d: "REJECTED", why: "ნიშანი " + g + " ჩაბარების ზღვარზე (" + state.rules.passGrade + ") დაბალია" };
    return { d: "ISSUE", why: "კურსი ჩაბარებულია, ნიშანი " + g };
  }
  if (k === "workshop") {
    if (rec.result === "completed") return { d: "ISSUE", why: "ვორქშოფს სრულად დაესწრო" };
    if (rec.result === "absent") return { d: "REJECTED", why: "ვორქშოფს არ დასწრებია" };
    return { d: "REVIEW", why: "ნაწილობრივი დასწრება: გადაწყვეტილებას ადმინი იღებს" };
  }
  if (rec.result === "failed") return { d: "REJECTED", why: "ბუთქემპის პროექტი ვერ ჩაბარდა" };
  if (rec.result === "pending") return { d: "REVIEW", why: "პროექტი ჯერ შეფასებას ელოდება" };
  if (state.rules.appliedNeedsApproval) return { d: "REVIEW", why: "პროექტი ჩაბარდა; წესის მიხედვით Applied შტამპს ადმინი ადასტურებს" };
  return { d: "ISSUE", why: "ბუთქემპის პროექტი ჩაბარდა" };
}
async function processLms(when) {
  const todo = state.lms.filter(r => r.status === "NEW");
  const byStudent = new Map();
  const sum = { ISSUED: 0, REJECTED: 0, REVIEW: 0, SKIPPED: 0 };
  for (const r of todo) {
    const e = evaluateRecord(r);
    r.reason = e.why;
    if (e.d === "ISSUE") {
      const st = state.students.find(s => s.email === r.email);
      st.stamps.push({ code: r.code, earnedAt: r.date, earnedThrough: earnedThroughFor(r), issuedVia: "LMS" });
      byStudent.set(st, (byStudent.get(st) || []).concat(SKILL[r.code].name));
      r.status = "ISSUED";
    } else r.status = e.d;
    sum[r.status]++;
  }
  for (const [st, names] of byStudent) await createVersion(st, "ავტომატურად LMS-დან: " + names.join(", "), when);
  if (todo.length) {
    state.lastSync = when || new Date().toISOString();
    logAction("LMS სინქრონიზაცია: გაიცა " + sum.ISSUED + ", არ გაიცა " + sum.REJECTED + ", ადმინთან " + sum.REVIEW, when);
  }
  return { sum, n: todo.length, last: todo[todo.length - 1] };
}
async function decideReview(id, approve) {
  const r = state.lms.find(x => x.id === id);
  if (!r || r.status !== "REVIEW") return null;
  const st = state.students.find(s => s.email === r.email);
  if (approve && st && !st.stamps.some(s => s.code === r.code)) {
    st.stamps.push({ code: r.code, earnedAt: r.date, earnedThrough: earnedThroughFor(r), issuedVia: "LMS+ADMIN" });
    r.status = "ISSUED"; r.reason = "ადმინმა დაადასტურა";
    const v = await createVersion(st, "ადმინმა დაადასტურა: " + SKILL[r.code].name);
    save(); return v;
  }
  r.status = "REJECTED";
  r.reason = approve ? "ვერ გაიცა: სტუდენტი ვერ მოიძებნა ან შტამპი უკვე აქვს" : "ადმინმა უარყო";
  logAction("ადმინმა უარყო: " + r.email + " · " + SKILL[r.code].name);
  save(); return null;
}
function roleProgress(st, role) {
  const has = new Map(st.stamps.map(s => [s.code, s]));
  const steps = [...role.skills].sort((a, b) => TIERS.indexOf(SKILL[a].tier) - TIERS.indexOf(SKILL[b].tier));
  const done = steps.filter(c => has.has(c));
  return { has, steps, done, next: steps.find(c => !has.has(c)), pct: Math.round(done.length / steps.length * 100) };
}

const CSV_SAMPLE = [
  "email,skill_code,date,earned_through",
  "nino.beridze@btu.edu.ge,AI_PROTO,2026-10-15,AI Solution Prototype Bootcamp",
  "ana.maisuradze@btu.edu.ge,PROMPT_PRO,2026-10-15,Workshop",
  "saba.gelashvili@btu.edu.ge,PROMPT_PRO,2026-10-15,Workshop",
  "unknown.person@btu.edu.ge,PROMPT_PRO,2026-10-15,Workshop",
].join("\n");
let csvState = { text: CSV_SAMPLE, report: null };

async function importCsv(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length && /email|passport/i.test(lines[0])) lines.shift();
  const report = [], touched = new Map();
  for (const [i, line] of lines.entries()) {
    const [who, code, date, through] = line.split(",").map(x => (x || "").trim());
    const st = state.students.find(s => s.email === (who || "").toLowerCase() || s.passportId === who);
    const n = "ხაზი " + (i + 2) + ": ";
    if (!st) { report.push({ ok: false, t: n + "სტუდენტი ვერ მოიძებნა (" + who + ")" }); continue; }
    if (!SKILL[code]) { report.push({ ok: false, t: n + "უცნობი უნარის კოდი (" + code + ")" }); continue; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date || "")) { report.push({ ok: false, t: n + "თარიღი უნდა იყოს YYYY-MM-DD" }); continue; }
    if (st.stamps.some(s => s.code === code)) { report.push({ ok: false, t: n + fullName(st) + "-ს ეს შტამპი უკვე აქვს" }); continue; }
    st.stamps.push({ code, earnedAt: date, earnedThrough: through || TIER[SKILL[code].tier].earned, issuedVia: "ADMIN" });
    touched.set(st.slug, (touched.get(st.slug) || []).concat(SKILL[code].name));
    report.push({ ok: true, t: n + fullName(st) + " ← " + SKILL[code].name });
  }
  for (const [slug, names] of touched) {
    const st = student(slug);
    const v = await createVersion(st, "CSV იმპორტი: " + names.join(", "));
    report.push({ ok: true, t: fullName(st) + ": შეიქმნა v" + v.versionNo + " (ბლოკი #" + v.block + ")" });
  }
  save();
  return report;
}

        : '<div class="row"><button class="btn danger" id="r-ask" type="button"' + (cur.status === "ACTIVE" ? "" : " disabled") + '>v' + cur.versionNo + '-ის გაუქმება</button></div>') +
    '</div>' +
    '<div class="card form">' +
      '<h3>დემოს თავიდან დაწყება</h3>' +
      '<p class="muted small" style="margin:0">აღადგენს 6 სატესტო სტუდენტს და ბლოკჩეინს საწყის მდგომარეობაში. დამატებული სტუდენტები და შტამპები წაიშლება.</p>' +

  });
  el.querySelectorAll("[data-reject]").forEach(b => b.onclick = async () => { await decideReview(b.dataset.reject, false); toast("უარყოფილია"); renderAdmin(); });
  const skillSel = $("a-skill"), through = $("a-through");
  const syncThrough = () => { if (skillSel) through.value = TIER[SKILL[skillSel.value].tier].earned; };
  syncThrough();
  if (skillSel) skillSel.onchange = syncThrough;
  $("a-student").onchange = e => { ui.student = e.target.value; ui.confirmRevoke = false; renderAdmin(); };
  $("stamp-form").onsubmit = async e => {
    e.preventDefault();
    if (!skillSel) return;
    const btn = $("a-submit"); btn.disabled = true; btn.textContent = "იწერება ბლოკში…";
    const code = skillSel.value;
    st.stamps.push({ code, earnedAt: $("a-date").value || today, earnedThrough: through.value.trim() || TIER[SKILL[code].tier].earned, description: $("a-desc").value.trim() || undefined, issuedVia: "ADMIN" });
    await new Promise(r => setTimeout(r, 650));
    const v = await createVersion(st, "დაემატა შტამპი: " + SKILL[code].name);
    save();
    ui.lastAdded = code; ui.shared = false;
    toast("შეიქმნა v" + v.versionNo + " · ბლოკი #" + v.block);
    setTab("passport");
  };
  $("csv-text").oninput = e => { csvState.text = e.target.value; };
  $("csv-file").onchange = async e => { const f = e.target.files[0]; if (!f) return; csvState.text = await f.text(); csvState.report = null; renderAdmin(); };
  $("csv-codes").onclick = () => { const l = $("csv-codes-list"); l.hidden = !l.hidden; };
  $("csv-run").onclick = async () => {
    const b = $("csv-run"); b.disabled = true; b.textContent = "მუშავდება…";
    csvState.report = await importCsv($("csv-text").value);
    const ok = csvState.report.filter(r => r.ok).length;
    toast("იმპორტი დასრულდა");
    renderAdmin();
    if (!ok) return;
  };
  if ($("r-ask")) $("r-ask").onclick = () => { ui.confirmRevoke = true; renderAdmin(); };
  if ($("r-no")) $("r-no").onclick = () => { ui.confirmRevoke = false; renderAdmin(); };
  if ($("r-yes")) $("r-yes").onclick = async () => {
    await addBlock("REVOKE", cur.hash); cur.status = "REVOKED"; ui.confirmRevoke = false;
    logAction(fullName(st) + " · v" + cur.versionNo + " გაუქმდა (REVOKE)");
    save(); toast("v" + cur.versionNo + " გაუქმდა"); renderAdmin();
  };
  $("reset").onclick = async () => {
    await seed();
    ui = { ...ui, student: "giorgi-kapanadze", lastAdded: null, confirmRevoke: false, shared: false, cmpA: null, cmpB: null };
    verifyState = freshVerify(); csvState = { text: CSV_SAMPLE, report: null }; lmsForm = freshLmsForm();
    toast("მონაცემები აღდგა"); renderAdmin();
  };
}

function careerSummary(st) {
  const tr = ROLE[st.targetRole];
  if (!tr) return '<div class="cgoal"><span class="muted small">კარიერული მიზანი არ არის არჩეული</span><button class="linkish" id="go-career" type="button">მიზნის არჩევა →</button></div>';
  const p = roleProgress(st, tr);
  return '<div class="cgoal"><span class="muted small">კარიერული მიზანი</span><b>' + esc(tr.name) + ' · ' + p.done.length + '/' + p.steps.length + '</b>' +
    '<span class="mtrack"><div style="width:' + p.pct + '%"></div></span>' +
    '<span class="small">' + (p.next ? "შემდეგი: " + esc(SKILL[p.next].source) : "ყველა საჭირო უნარი დადასტურებულია") + '</span>' +
    '<button class="linkish" id="go-career" type="button">კარიერული გზა →</button></div>';
}
function renderCareer() {
  const el = $("panel-career");
  const st = student(ui.student);
  const ranked = ROLES.map(r => ({ r, p: roleProgress(st, r) })).sort((a, b) => b.p.pct - a.p.pct);
  const chosen = ROLE[st.targetRole];
  const role = chosen || ranked[0].r;
  const p = roleProgress(st, role);
  const left = { workshop: 0, bootcamp: 0, course: 0 };
  p.steps.filter(c => !p.has.has(c)).forEach(c => left[KIND[SKILL[c].tier]]++);
  const leftText = Object.entries(left).filter(([, n]) => n).map(([k, n]) => n + " " + KIND_KA[k]).join(", ");
  const steps = p.steps.map((c, i) => {
    const k = SKILL[c], got = p.has.get(c), isNext = c === p.next;
    return '<div class="step' + (got ? " done" : isNext ? " next" : "") + '">' +
      '<span class="mark" aria-hidden="true">' + (got ? "✓" : i + 1) + '</span>' +
      '<div style="min-width:0"><b class="small" style="display:flex;gap:6px;align-items:center">' + dot(k.tier) + esc(k.name) + '</b>' +
      '<span class="muted small">' + esc(k.source) + ' · ' + KIND_KA[KIND[k.tier]] + '</span></div>' +
      '<span class="st ' + (got ? "add" : isNext ? "" : "muted") + '">' + (got ? "მიღებულია " + esc(got.earnedAt) : isNext ? "<b>შემდეგი ნაბიჯი</b>" : KIND_TIME[KIND[k.tier]]) + '</span></div>';
  }).join("");
  const nx = p.next ? SKILL[p.next] : null;
  el.innerHTML =
    '<div class="layout"><div class="card form" style="gap:18px">' +
      '<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2 class="h">კარიერული გზამკვლევი</h2><p class="muted small" style="margin:0">აირჩიე სასურველი პოზიცია და ნახე, რა გაკლია და რა გააკეთო შემდეგ.</p></div>' +
      '<label class="f" for="c-stu" style="min-width:200px">სტუდენტი<select id="c-stu">' + studentOptions(st.slug) + '</select></label></div>' +
      '<div class="role-head"><div class="ring lg" style="--p:' + p.pct + '"><span>' + p.pct + '%</span></div><div style="min-width:0">' +
        (chosen ? "" : '<span class="pill tier">შემოთავაზებული: ყველაზე ახლოს მყოფი როლი</span>') +
        '<h2>' + esc(role.name) + '</h2><div class="muted">' + esc(role.ka) + '</div><p>' + esc(role.blurb) + '</p>' +
        '<p><b>ამ როლისთვის ' + p.steps.length + ' შტამპიდან ' + p.done.length + ' გაქვს.</b>' + (leftText ? ' დარჩენილია: ' + leftText + '.' : "") + '</p>' +
        (chosen ? "" : '<div style="margin-top:8px"><button class="btn primary sm" type="button" id="c-set">მიზნად დაყენება</button></div>') +
      '</div></div>' +
      (nx
        ? '<div class="nextbox"><span class="lbl">შემდეგი ნაბიჯი</span><b>' + esc(nx.source) + '</b><span class="small">' + KIND_KA[KIND[nx.tier]] + ' · ' + KIND_TIME[KIND[nx.tier]] + ' · შტამპი: ' + esc(nx.name) + ' (' + TIER[nx.tier].label + ')</span>' +
          '<span class="muted small">დასრულების შემდეგ შედეგი უნივერსიტეტის სისტემაში აისახება და შტამპი პასპორტში ავტომატურად დაემატება.</span></div>'
        : '<div class="result VALID"><div class="big">როლისთვის საჭირო ყველა უნარი დადასტურებულია</div><div>პასპორტი მზადაა ამ პოზიციაზე განაცხადისთვის. გაუზიარე დამსაქმებელს.</div></div>') +
      '<div><h3 style="margin:0 0 6px">გზა ეტაპებად</h3><div class="road">' + steps + '</div></div>' +
      '<div class="legend">' + TIERS.map(t => '<span>' + dot(t) + TIER[t].label + '</span>').join("") + '</div>' +
    '</div>' +
    '<aside class="side"><h3>ყველა როლი შენი შტამპებით</h3><div class="role-list">' +
      ranked.map(x => '<button class="role-btn" type="button" data-role="' + x.r.id + '" aria-pressed="' + (x.r.id === role.id) + '"><span class="top"><span>' + esc(x.r.name) + '</span><span>' + x.p.done.length + '/' + x.p.steps.length + '</span></span><span class="mtrack"><div style="width:' + x.p.pct + '%"></div></span></button>').join("") +
    '</div><p class="muted small" style="margin:0">კარიერული მიზანი პირადი გეგმაა და პასპორტის hash-ში არ შედის. დამსაქმებელი მხოლოდ დადასტურებულ შტამპებს ხედავს.</p>' +
    '<button class="btn sm" type="button" id="c-pass">პასპორტის ნახვა</button></aside></div>';

  $("c-stu").onchange = e => { ui.student = e.target.value; renderCareer(); };
  if ($("c-set")) $("c-set").onclick = () => { st.targetRole = role.id; save(); toast("მიზანი: " + role.name); renderCareer(); };
  $("c-pass").onclick = () => setTab("passport");
  el.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { st.targetRole = b.dataset.role; save(); renderCareer(); });
}

    '<aside class="side">' +
      '<h3>ჯაჭვის მთლიანობა</h3>' +
      '<div class="result ' + (bad.size ? "NOT_FOUND" : "VALID") + '"><div class="big">' + (bad.size ? "ჯაჭვი დაზიანებულია" : "ჯაჭვი მთელია") + '</div><div>' + state.ledger.length + ' ბლოკი' + (bad.size ? ", დაზიანებული: " + [...bad].map(i => "#" + i).join(", ") : "") + '</div></div>' +
      '<p class="muted small" style="margin:0">ყოველი ბლოკი წინა ბლოკის hash-ს ინახავს. ერთი ძველი ჩანაწერის შეცვლაც ყველა მომდევნო კავშირს არღვევს, ამიტომ ისტორიას ვერავინ გადაწერს.</p>' +
      (backup ? '<button class="btn" id="l-fix" type="button">ბლოკის აღდგენა</button>' : '<button class="btn danger" id="l-tamper" type="button">სცადეთ ბლოკ #1-ის შეცვლა</button>') +
      '<hr class="sep"><h3>რეალურ ვერსიაში</h3><p class="muted small" style="margin:0">ბლოკების ნაცვლად გამოიყენება PassportRegistry smart contract Polygon Amoy ქსელზე: issue(hash), revoke(hash), verify(hash). ტრანზაქციები Polygonscan-ზე ჩანს.</p>' +
    '</aside></div>';
  if ($("l-tamper")) $("l-tamper").onclick = () => { const b = state.ledger[1] || state.ledger[0]; backup = { i: b.index, h: b.passportHash }; b.passportHash = b.passportHash.slice(0, -1) + (b.passportHash.endsWith("0") ? "1" : "0"); renderLedger(); };
  if ($("l-fix")) $("l-fix").onclick = () => { state.ledger[backup.i].passportHash = backup.h; backup = null; renderLedger(); };
}

/* =========================================================
   15. Tabs, theme, boot
   ========================================================= */
const RENDER = { passport: renderPassport, career: renderCareer, students: renderStudents, lms: renderLms, admin: renderAdmin, employer: renderEmployer, verify: renderVerify, analytics: renderAnalytics, ledger: renderLedger };
function setTab(tab) {
  if (backup) { state.ledger[backup.i].passportHash = backup.h; backup = null; }
  ui.tab = tab;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  Object.keys(RENDER).forEach(t => $("panel-" + t).hidden = t !== tab);
  if (tab === "admin") ui.confirmRevoke = false;
  RENDER[tab]();
  updateBadges();
  try { localStorage.setItem(STORE_KEY + ":tab", tab); } catch (e) {}
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));

const THEMES = ["system", "light", "dark"], THEME_KA = { system: "სისტემური", light: "ნათელი", dark: "მუქი" };
function applyTheme(t) {
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  $("theme-btn").textContent = "თემა: " + THEME_KA[t];
  try { localStorage.setItem(STORE_KEY + ":theme", t); } catch (e) {}
}
let theme = "system";
try { theme = localStorage.getItem(STORE_KEY + ":theme") || "system"; } catch (e) {}
applyTheme(theme);
$("theme-btn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); };

(async () => {
  const saved = load();
  if (saved && saved.students && saved.ledger) { state = saved; state.log = state.log || []; state.lms = state.lms || []; state.rules = state.rules || DEFAULT_RULES(); state.students.forEach(s => { s.hidden = s.hidden || []; }); }
  else await seed();
  if (!student(ui.student)) ui.student = state.students[0].slug;
  const h = location.hash.slice(1);
  if (/^v[0-9a-f]{64}$/i.test(h)) { openVerifyHash(h.slice(1)); return; }
  let tab = "passport";
  try { tab = localStorage.getItem(STORE_KEY + ":tab") || "passport"; } catch (e) {}
  setTab(RENDER[tab] ? tab : "passport");
})();
})();
</script>
